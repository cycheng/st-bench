TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumBenchmarks: 1
  SyncsPerBenchmark: 1
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PruneSparseMode: 0
  DataInitTypeA: 23
  DataInitTypeB: 24
  DataInitTypeC: 0
  DataInitTypeD: 0
  DataInitTypeMXSA: 23
  DataInitTypeMXSB: 24
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 10
  EnqueuesPerSync: 30
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  OutputLoopIR: True

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 1, 4, 1]
        - HalfPLR: [0]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMLoadWaveSync: [False]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [2]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [1]
        - ClusterDim: [[1, 1]]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - LDSSegmentInterleave: [0]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - AssertSummationElementMultiple: [128]
        - UseLoopModel: [True]
        #- LoopModelWaitCntMode: [GIR, StinkyTofu]
        - LoopModelWaitCntMode: [GIR]
        - TDMFuse: [3]
        - TDMSplitA: [1]
        - TDMSplitB: [0]
        - LoopOrder: [MKNMKN]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65536, 16, 1, 32768]
        - ActivationArgs:
          - [Enum: none]
