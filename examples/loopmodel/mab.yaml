TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  NumBenchmarks: 1
  SyncsPerBenchmark: 1
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 23
  DataInitTypeB: 24
  DataInitTypeC: 0
  DataInitTypeD: 0
  DataInitTypeMXSA: 23
  DataInitTypeMXSB: 24
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 10
  EnqueuesPerSync: 30
  PrintWinnersOnly: False #True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  OutputLoopIR: True

BenchmarkProblems:
  #######################################
  # TN - standard, MXF8SS Block32, E8
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

     # - BenchmarkProblemSizeGroup - Standard
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  4, 1,  4, 1]
        - HalfPLR: [0]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMLoadWaveSync: [False]
        - TDMIterateMode: [-1] #[-1,0,1,2,3]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - PrefetchLocalRead: [2, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [1]
        - ClusterDim: [[1, 1]]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1] #[1,2,4,8]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1] #[-1,1]
        - VectorWidthB: [-1] #[-1,1]
        - LocalReadVectorWidth: [-1]
        - LDSSegmentInterleave: [0] #[1]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - AssertSummationElementMultiple: [ 128 ]
        - UseLoopModel: [True] #[False, True]
        - TDMFuse: [3] #[3, 5] #[1, 3, 5]
        - TDMSplitA: [1]
        - TDMSplitB: [0]
        - LoopOrder: [MKNMKN] #[NMKNMK, NMKNMK, NKMNKM, MNKMNK, MKNMKN]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65536, 16, 1, 32768]
        - ActivationArgs:
          - [Enum: none]
