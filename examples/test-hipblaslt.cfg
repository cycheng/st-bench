# For task_type=hipblaslt_install:
task_type=hipblaslt_install
hipblaslt_repo_path=${rocm_libraries_path}/projects/hipblaslt
hipblaslt_install_flags=-gidc -a gfx1250 --logic-yaml-filter gfx1250/GridBased/* --skip_rocroller
hipblaslt_build_type=debug
hipblaslt_symlink_name=hipblaslt-test-asm

build_dir=/data0/cycheng2/rocm-libraries/projects/hipblaslt/tensilelite/new_rel_build_cy_mi450
rocm_libraries_path=/data0/cycheng2/rocm-libraries
container=cy_mi450
workdir=/data0/cycheng2/tickets/st-codegen-test
output_root=./asm

# runtime envs from old 1-run-mi450.sh
env=ROCM_PATH=/opt/rocm
env=PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env=HSA_MODEL_LIB=/root/mi450_44/_builds/mi450/Release/lib/libhsakmtmodel.so
env=HSA_ENABLE_SDMA=0
env=HSA_ENABLE_ITERRUPT=0
env=HSA_MODEL_TOPOLOGY=/root/mi450_44/topology/mi450
env=TARGET_ARCH=gfx1250
env=ENABLE_DEBUG_STINKYTOFU_ASM=1

# optional
docker_auto_start=true
keep_container_out=false
