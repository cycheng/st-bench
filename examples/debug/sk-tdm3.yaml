TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationComputeDataType: 0
      ActivationType: hipblaslt_all
      ActivationNoGuard: False
      SupportUserArgs: True
      UseBias: 1
      BiasSrc: D
      BiasDataTypeList: [0, 7]
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MaxOccupancy: [40]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 3, 4, 1]
        - DepthU: [32]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - LdsPadMetadata: [0]
        - TransposeLDS: [1]
        - ClusterLocalRead: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - ScheduleIterAlg: [4]
        - StoreVectorWidth: [8]
        - GlobalSplitU: [0]
        - StreamK: [3]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [1]
        - MIArchVgpr: [True]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - InitCIterWmma: [1]
        - WavefrontSize: [32]
        - WorkGroupMappingXCC: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [40, 40, 3, 40]
        - BiasTypeArgs: [0, 7]
        - ActivationArgs:
          - [Enum: none]

