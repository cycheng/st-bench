TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 1
  # Validate EVERY output element against the CPU reference (problem is tiny).
  NumElementsToValidate: -1
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 16      # maximum number of mismatches to print
  ValidationPrintValids: False  # print matches too
  PruneSparseMode: 0
  # Same data-init as the mxf4 bf16out benchmark that generated this kernel.
  DataInitTypeA: 13
  DataInitTypeB: 12
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2          # beta = 2 (matches the failing smoke case)
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0


BenchmarkProblems:
  -
    - # ProblemType, TN  (MXF4 A/B, bf16 D, E8M0 block-32 scales)
      OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        # Single solution == the failing kernel:
        #   MT256x256x128_MI16x16x1 ... SIA4_SS1 ... MXLITDM_MXSFIMS ... VWA8_VWB8 ... WG32_4_1
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  1, 1,  2, 2]   # MIWaveTile[1,1] -> MT32x32 (smallest kernel)
        - DepthU: [128]
        - TDMInst: [3]
        - HalfPLR: [0]
        - TDMIterateMode: [0]
        - PrefetchGL2: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]        # auto (VWA=8 rejected below MIWaveTile 8)
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[1,1]]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # [ M, N, batch, K ].  K must be 512 to trigger the race
          # (K=256/128 pass).  M=8,N=32 is the smallest reliably-failing tile
          # (16x16 passes; 8x32 / 16x24 fail 12/12).
          - Exact: [8, 32, 1, 512]

LibraryLogic:
    ScheduleName: "gfx1250"
    DeviceNames: ["Device 0073"]
    ArchitectureName: "gfx1250"
    LibraryType: "GridBased"

LibraryClient:


