GlobalParameters:
  Architecture: gfx1250
  BatchMode: 0
  CodeObjectVersion: "4"
  BoundsCheck: 0
  NumElementsToValidate: -1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 0
  DataInitTypeScaleAlphaVec: 1
  NumWarmups: 0
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 0
  KernelTime: False
  KeepBuildTmp: True
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      UseBias: 1
      UseScaleAlphaVec: 1
      SupportUserArgs: True

    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]

      ForkParameters:
        - Groups:
          -
            - MatrixInstruction: [16, 16, 32, 1, 1, 8, 8, 2, 2]
              WorkGroup: [32, 4, 1]
              MIArchVgpr: True

        - DepthU: [32]
        - WavefrontSize: [32]
        - StreamK: [3]
        - GlobalSplitU: [0]
        - GlobalSplitUAlgorithm: [MultipleBuffer]

        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [1]
        - TransposeLDS: [1]

        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - ScheduleIterAlg: [4]
        - ScheduleGROverBarrier: [0]
        - ClusterLocalRead: [0]
        - ExpandPointerSwap: [False]

        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - VectorWidthA: [8]
        - VectorWidthB: [8]
        - LocalReadVectorWidthA: [8]
        - LocalReadVectorWidthB: [8]
        - StoreVectorWidth: [8]

        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - LdsPadMetadata: [0]
        - LdsBlockSizePerPadA: [512]
        - LdsBlockSizePerPadB: [512]
        - LdsBlockSizePerPadMXSA: [0]
        - LdsBlockSizePerPadMXSB: [0]
        - LdsBlockSizePerPadMetadata: [0]

        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [0]
        - InitCIterWmma: [1]
        - MinGRIncPerMfma: [1]
        - MaxOccupancy: [40]
        - MaxLDS: [327680]
        - MbskPrefetchMethod: [0]
        - UseCustomMainLoopSchedule: [0]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]

        - WorkGroupMapping: [8]
        - WorkGroupMappingXCC: [1]
        - WorkGroupMappingXCCGroup: [-1]
        - StaggerUMapping: [0]
        - StaggerU: [32]
        - StaggerUStride: [256]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [127, 127, 1, 2047]
        - BiasTypeArgs: [s]
        - ActivationArgs:
            - [Enum: none]

